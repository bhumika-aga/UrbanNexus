server:
  port: 8080

spring:
  # Local development uses an embedded H2 database running in PostgreSQL
  # compatibility mode, so the same schema.sql / data.sql / native queries that
  # run against Supabase in production behave identically here. No external
  # database is required for local development.
  datasource:
    url: jdbc:h2:file:./data/urbannexus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      separator: ";"

app:
  cors:
    # Frontend origin(s) allowed to call the API from a browser, comma-separated; patterns like
    # http://localhost:* are allowed. Production must set CORS_ALLOWED_ORIGINS (see application-prod.yml).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  # Time zone of the community; decides what "today" is for booking dates.
  timezone: Asia/Kolkata
  jwt:
    # Secret is supplied via the JWT_SECRET environment variable (no default);
    # generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.urbannexus: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
