spring:
  datasource:
    # The complete JDBC URL (host, database, credentials, and options) is supplied
    # by the DB_URL environment variable — nothing environment-specific is stored
    # in this file. For Supabase, use the Supavisor transaction pooler URL: it is
    # reachable over IPv4 (the direct db.<ref>.supabase.co host is IPv6-only, which
    # IPv4-only hosts like Render cannot reach), and it must include
    # prepareThreshold=0 so the transaction pooler can multiplex connections safely.
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  # The H2 console is a local-development tool; never expose it in production.
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    # Don't print every SQL statement to the production logs.
    show-sql: false
    hibernate:
      # Reconciles the schema (creates missing tables/columns) but never drops.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      # Defaults to "never" so restarts NEVER drop or reseed production data.
      # For the very first deploy against an empty database, set DB_INIT_MODE=always
      # once to run schema.sql + data.sql, then remove it (or leave it unset).
      mode: ${DB_INIT_MODE:never}
      separator: ";"

app:
  cors:
    # Required: the deployed frontend's origin(s), comma-separated, e.g. https://urbannexus.onrender.com.
    # With no value set, browsers are refused all cross-origin API calls.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.urbannexus: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
