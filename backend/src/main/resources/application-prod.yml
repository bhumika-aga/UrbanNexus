spring:
  datasource:
    # Supabase-hosted PostgreSQL. All values come from the environment; the
    # non-secret connection parts have defaults, but DB_PASSWORD (and the shared
    # JWT_SECRET in application.yml) MUST be provided as environment variables.
    url: jdbc:postgresql://${DB_HOST:db.vghgfawwdzsdnwoyisao.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      # Reconciles the schema (creates missing tables/columns) but never drops.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      # Defaults to "never" so restarts NEVER drop or reseed production data.
      # For the very first deploy against an empty database, set DB_INIT_MODE=always
      # once to run schema.sql + data.sql, then remove it (or leave it unset).
      mode: ${DB_INIT_MODE:never}
      separator: ";"

logging:
  level:
    root: INFO
    com.urbannexus: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
